    "&gt;AI work at schools, science education in 2030, AI guidance, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;An excellent week!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;First, what a delight it has been to work with schools as the year has gotten started, especially those for whom &lt;em&gt;Irreplaceable&lt;/em&gt; was their summer reading. Conversations have spanned from AI itself (how it works, how to use it effectively, how it has developed) to intersections with ethics, learning science, how different divisions might engage AI (teachers or students), and more. Don’t hesitate to reach out if your school is looking for support or guidance.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;This week’s features cover two very different topics.  First, former college president Paul LeBlanc pens an excellent exploration into the value of higher education in a time of digital transformation in many workplaces. He looks specifically at what parents and high school students might look for in a college or university as the world changes.  Then also, in a time of continued political instability (chaos?), see a thoughtful piece on what voice educational institutions might have in public discourse.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also this week: a few posts on curiosity and creativity, some reflections on the new (school) year, and a remarkable story of a Wall Street Journal op-ed written with the aid of AI — and the author and editor who defended it. See that last one in three parts in the Reading/Writing section.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Last: Claude for Teachers is now free for teachers &lt;em&gt;and&lt;/em&gt; the enterprise version for schools is also free for schools. If you are looking for what may be highest quality enterprise foundation model — and also the one with what seems the most human-centered approach — this is a good opportunity.  And it’s free, at least for now.  See the AI Update for more information.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;PS. I’m happy to share a list of engagements coming up in the months ahead and would love to connect if you’ll be at any:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;September 23 (and later): &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://portal.academyforteachers.org/events/what-the-ai-moment-means-for-good-teaching"&gt;“What the AI Moment Means for Good Teaching”&lt;/a&gt; – Academy for Teachers&lt;/b&gt;, online, based in NYC&lt;br&gt;
This five part online course event is a virtual PD offering primarily for NYC teachers at Academy for Teachers member public, private, and charter schools — but teachers at non-member schools both in and beyond NYC are able to register for a small fee. Each session is two weeks apart.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;September 25-26: &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.facebook.com/biskgz/posts/architects-of-tomorrow-shaping-future-ready-studentsthe-central-asia-federation-/1481018550727560/"&gt;Architects of Tomorrow&lt;/a&gt; – CAFA PD Conference&lt;/b&gt;, Bishkek, Kyrgyzstan&lt;br&gt;
I’m so happy to join with a host of schools in Central Asia for future-oriented discussion about the role of AI in education.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 18-19: &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.paispa.org/events/save-the-date-elevate-learning-conference"&gt;Elevate Learning&lt;/a&gt;: A Teaching &amp;amp; Learning Conference –&lt;/b&gt; &lt;b&gt;PAIS&lt;/b&gt;, Pittsburgh, Pennsylvania&lt;br&gt;
This is doubly exciting, as &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://schooledthemusical.com"&gt;&lt;em&gt;Schooled the Musical&lt;/em&gt;&lt;/a&gt; will feature on October 18, and I’ll join a panel on the morning of the 19th for conversation about AI.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 22: &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.hais.us/SOTF_Conference"&gt;Schools of the Future&lt;/a&gt; – HAIS, Hawaii Dept of Education,&lt;/b&gt; Honolulu, Hawaii&lt;br&gt;
Serving schools across Hawaii, this event is hosting a series of excellent, provocative, and inspiring discussions.  More information to come in the weeks ahead.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;em&gt;Later events will be announced in future issues.&lt;/em&gt;&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“What might “institutional neutrality” mean in 2026? Is it still a useful term? One problem is that “neutrality” can be misunderstood to mean that the institution must always remain silent. But colleges are not always neutral, and they must not always remain silent — because there are some matters they need to opine about… In its place, I suggest “institutional reticence.” …a purposeful reticence faithful to and focused on the university’s mission also generates its own limits, creating circumstances when colleges can and should (even must!) take institutional stances. I see four such domains.”&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Each week seems to outdo the previous…&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In this issue’s features, check out the survey by Common Sense Media on how students feel about school and AI. What I particularly appreciate is that it captures sentiments beyond AI itself, which helps provide some context to the sentiments about AI.  Also in the features, the essay by Michael Wagner in his Augmented Educator blog nicely focuses in on the single factor that matters most about the risks of using AI detectors. It’s a worthy read.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also, I had previously highlighted Claude for Teachers as a great, free option for teachers. Now Anthropic has made an enterprise version available to K-12 schools. This is an excellent option for schools that want both to have (what I think is) the highest quality tool and also to use the tool that seems to have the best moral/ethical compass of all the AI companies. LLM wrappers like FlintK-12 and others make good specific tools for schools; this is the best foundation model option.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the bigger picture, the Ethics and Risk section catalogs the growing concern about the safety issues emerging today. Bill Gates spells out three specific concerns in a lengthy essay.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;And most practically, see the Uses and Applications section for some helpful prompts to pursue new directions of thinking and inquiry with AI tools.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
