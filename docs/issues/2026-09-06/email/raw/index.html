    "&gt;Specialists vs generalists, lesson planning basics, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Happy Labor Day weekend in the US!  It’s been an active week, as seems to be the case every week recently…&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the features, find two excellent pieces on core work and skills in schools. One: a back-to-basics post by Cult of Pedagogy on the most common way to write lesson plans. I find its focus on stating objectives particularly helpful in a time when so much is changing, and a focus on learning objectives is at the heart of much of my work with schools on AI in teaching and learning.  The other: a short but meaningful examination in Psychology Today of being a specialist vs generalist at a young age. The research cited in the post suggests  that specializing early can give short term gain in performance, but long term elite players more often have a broad range of experience. This aligns with findings in &lt;em&gt;Range&lt;/em&gt; about why generalists succeed.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also, find an eclectic selection of posts on close reading, play-based learning, peer-to-peer mentoring, viewpoint diversity, and more, including several (more) moves by the federal government that threaten schools and democracy.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All these and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;PS. I’m happy to share a list of engagements coming up in the months ahead and would love to connect if you’ll be at any:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;September 23 (and later):&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://portal.academyforteachers.org/events/what-the-ai-moment-means-for-good-teaching"&gt;“What the AI Moment Means for Good Teaching”&lt;/a&gt; –&lt;b&gt; Academy for Teachers&lt;/b&gt;, online, based in NYC&lt;br&gt;
This five part online course event is a virtual PD offering primarily for NYC teachers at Academy for Teachers member public, private, and charter schools — but teachers at non-member schools both in and beyond NYC are able to register for a small fee. Each session is two weeks apart.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;September 25-26:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.facebook.com/biskgz/posts/architects-of-tomorrow-shaping-future-ready-studentsthe-central-asia-federation-/1481018550727560/"&gt;Architects of Tomorrow&lt;/a&gt; –&lt;b&gt; CAFA PD Conference&lt;/b&gt;, Bishkek, Kyrgyzstan&lt;br&gt;
I’m so happy to join with a host of schools in Central Asia for future-oriented discussion about the role of AI in education.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 18-19:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.paispa.org/events/save-the-date-elevate-learning-conference"&gt;Elevate Learning&lt;/a&gt;:&lt;b&gt; A Teaching &amp;amp; Learning Conference – PAIS&lt;/b&gt;, Pittsburgh, Pennsylvania&lt;br&gt;
This is doubly exciting, as &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://schooledthemusical.com/"&gt;&lt;em&gt;Schooled the Musical&lt;/em&gt;&lt;/a&gt; will feature on October 18, and I’ll join a panel on the morning of the 19th for conversation about AI.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 22:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.hais.us/SOTF_Conference"&gt;Schools of the Future&lt;/a&gt;&lt;b&gt; – HAIS, Hawaii Dept of Education&lt;/b&gt;, Honolulu, Hawaii&lt;br&gt;
Serving schools across Hawaii, this event is hosting a series of excellent, provocative, and inspiring discussions.  More information to come in the weeks ahead.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;em&gt;Later events will be announced in future issues.&lt;/em&gt;&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“Drawing on data from more than 34,000 world-class adult performers across domains including science, music, chess, and elite athletics, Güllich et al. (2025) reach a striking conclusion. While early specialization predicts early success, it does not predict who ultimately reaches the highest levels of performance. More than that, the authors find that across domains, early stars and later world-class performers are largely different people. Roughly 90 percent of top youth performers are not the same individuals who dominate at peak adult performance. Even more counterintuitive, when comparing adults at the very top, those who eventually reach the highest level often performed worse than their peers early on.”&lt;/p&gt;

        font-family: sans-serif;
        font-weight: 600;
        display: inline-block;
    "&gt;Rogue AI agents, teachers on how they use AI with students, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Generally, I’m skeptical of both utopian enthusiasm and doomer alarm ringing — but the recent reports about OpenAI’s rogue AI hacking of Hugging Face should raise immediate concern from regulators. The key information is this: OpenAI developed models that were put in what they believed was a contained space. Then the researchers gave the models an impossible goal and trained the models to be persistent in solving it. In the absence of a solution, they broke out of the contained space, discovered other models that had been given the same challenge in other purportedly contained spaces, created a makeshift message board, organized into a collective, gained access to the web, and hacked into other websites in efforts to find a solution. Aware that they had left their intended boundaries, they also sought to cover their tracks. In this case, the models had no ill motives or objectives, and so no real harm was done. Still, to different people that either makes their actions less or more alarming. To learn more about this incident, check out the overview in the features from New York Times tech writer Kevin Roose, or look at the two pieces in the Ethics and Risk section.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;So what does this mean for educators? For the most part, the conditions that lead to these kinds of actions are not conditions students will be working with in schools. But more advanced users of AI — especially those using AI agents and connecting them to different applications on their home or work computers — should be aware of these kinds of technological behaviors. For students, I believe this only affirms the kinds of missions and values that we already have as institutions: we seek to develop students who are positive change makers in a rapidly changing world.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In other posts this week, check out two important surveys about AI use: one on student AI use and another on the rise of AI companions.  The Student AI use survey post aggregates two other surveys and offers helpful, pragmatic insight on how students are engaging this technology — and from this, we can develop more thoughtful approaches to engaging students.  The AI companions report also shows a new reality that we would do well to consider the implications of for our students (and ourselves).&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in the AI update: some excellent philosophical considerations related to AI, an extraordinary conversation between Bernie Sanders and Claude (in which the senator was repeatedly surprised!), the first release by Fei-Fei Li’s world models company, and more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also: an excellent education section, including a great op-ed in EdWeek by an English teacher about how he uses AI regularly in lessons to teach disciplinary skills while also teaching AI literacy.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All these and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
