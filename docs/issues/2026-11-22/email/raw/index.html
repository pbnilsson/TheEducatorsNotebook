    "&gt;Introduction&lt;/h2&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="
        margin: 0rem 0rem 0rem 0rem;
        padding: 0;
        display: block;
        font-size: 14px;

        font-family: sans-serif;
        font-weight: 600;
        display: inline-block;
    "&gt;1:1 exams, ways to start class, leadership lessons, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;An excellent week, some good pedagogy, and an invitation!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In my first year of college, a visiting professor from Oxford ran 1:1 tutorials with each student in a political theory class. I remember my first one vividly. I sat down opposite his desk and he picked up my weekly reflection paper and read aloud the opening sentence. He asked, “What do you mean by this word here?” He asked about the next sentence and what its key idea was. It was an unforgettable lesson in the precision of my thinking and writing. It seems we’re moving back to this style of learning, where it is possible — and this isn’t a bad thing as part of a repertoire of approaches. I think it’s probably a very good thing — as part of a repertoire of approaches.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the features this week, find one teacher’s first tests with oral exams at a small scale. It’s a math professor, and I think the lessons and format are customizable to most any context. Also in the features, find early evidence that phone bans may be having a positive effect on learning.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Elsewhere this week: a pedagogy section with several start-of-class possibilities, a leadership section with a reminder that leaders are best when we are effective storytellers, several provocative curriculum posts, and more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also, I’m so happy to highlight that I’ll be at Gather in Boston on December 4, the week after Thanksgiving. If you’ll be there, please drop a line and I hope we can say hello.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All this and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;PS. I’m happy to share a list of engagements coming up in the months ahead, and would love to connect if you’ll be at any:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;December 4:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nais.org/events/gather"&gt;Gather&lt;/a&gt; — NAIS, Boston&lt;br&gt;
I’m thrilled to be sharing selections from Act One of &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://schooledthemusical.com"&gt;Schooled&lt;/a&gt; at Gather this year. With cast and crew from Tony-winning shows in NYC, as well as incredible young talent from Boston-area conservatories, please stop in for (what I think is) a compelling presentation of school in a time similar to our own.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;December 14:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.paispa.org/events/pais-and-paisbo-heads--cfos-convening"&gt;Heads and CFOs: AI as Arrival Technology&lt;/a&gt;” — PAIS/PAISBOA, Hershey, PA&lt;br&gt;
This joint membership meeting also includes &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nboa.org/about-nboa/people/patrick-schuermann-ed.d"&gt;Patrick Schuermann&lt;/a&gt; and &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://my.vanderbilt.edu/vanschaack/"&gt;Andy Van Schaack&lt;/a&gt; to facilitate heads and CFOs in a day exploring the question: What would need to be true to feel fully known, supported and strengthened as you face the headwinds of today and tomorrow, so the ‘power of the flock’ is behind you?&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;January 12:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://sais.org/event/sais-webinar-moving-your-ai-conversation-forward/"&gt;Moving Your AI Conversation Forward&lt;/a&gt;” - SAIS Webinar, online&lt;br&gt;
Does AI polarize your community? Join this webinar to gather tools for framing your community’s conversation so that different perspectives feel heard and you have the vocabulary to move forward together.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;March 4:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nais.org/events/annual-conference/program/signature-experiences"&gt;Schools and AI: Running in Two Directions at Once&lt;/a&gt;” - NAIS Thrive, Baltimore&lt;br&gt;
AI is pulling us ever further into technologically mediated experiences. Yet educators know the most powerful learning remains a social, human-to-human experience. The result is that schools must travel in both directions at once in order to continue providing the relational experiences excellent schools are known for while also preparing students for a technologically inundated world. I’m thrilled to lead this session with &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.door21consulting.com"&gt;Indu Singh&lt;/a&gt;, in which we surface both high-level principles for navigating these seemingly divergent paths and also practical tools for the deliberate work of uniquely human thinking, learning, and relationship building.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Later events will be announced in future issues.&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“The study looked at 3.3 million students between 2021 and 2026. They were in third through 10th grade, attending 4,600 U.S. schools. Using scores on MAP tests, which track achievement from fall to spring, it compared the performance of students at schools that put in strict phone bans with those at similar schools that did not have such bans. The annual gains reversed about half the annual loss that an average student experienced in the years leading up to the pandemic… He cautioned against being too optimistic about modest achievement gains, but added that “if they accumulate over time, year after year, that could be really important and really meaningful.”&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Two powerful — and very different — features this week.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;First, the new Harvard resource is an &lt;em&gt;excellent&lt;/em&gt; tool for making decisions about what forms of AI use may be effective at different developmental levels for students. Arriving at a cultural consensus will take some time, but this is a good, evidence-based approach to thinking about what students might be ready for.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Second, see the first of two posts this week from Alex Kotran that suggest a surprising reversal in perspectives.  What is it?  One of the fears about chatbots is that they will deepen the epistemic bubble that social media has created.  But Kotran observes a different trend: that AI models optimize around accuracy, not engagement, which means that they actually have a normalizing effect on discourse. They move away from polarizing fringes and towards the common middle ground.  Social media is “epistemically diverging” while AI is “epistemically converging.” This is a real surprise, and potentially a real social/cultural benefit.  (AI has already been shown to more effectively debunk conspiracy theories that people do.). I’m curious whether this behavior will continue as the technology develops.  The other post by Kotran is in the Ethics and Risk section — a rare &lt;em&gt;positive&lt;/em&gt; post in that section.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also this week, another example of a student committee on AI, an interesting report by Gallup on how AI is changing the way employees spend time at work, and more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;figure style="width: 500px; max-width: 100%; margin: 1rem auto;"&gt;&lt;a style="text-decoration: none; color: #409B90;" href="https://educatorsnotebook.com/assets/images/2026-11-More-or-Less-Time.webp"&gt;&lt;img src="https://educatorsnotebook.com/assets/images/2026-11-More-or-Less-Time.webp" alt="" width="500" style="display: block; width: 100%; max-width: 500px; height: auto; border: 0;"&gt;&lt;/a&gt;&lt;figcaption style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;How do people spend their time differently at work? See the Gallup poll in Uses and Applications.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&amp;nbsp;&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;                        &lt;/td&gt;
