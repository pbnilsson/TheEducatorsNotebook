    "&gt;Introduction&lt;/h2&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="

    "&gt;Summer Break, The Pope, The University of Chicago, and More&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Happy summer, all!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Look for headlines in the introduction to this issue:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;Happy Summer Break (for me, too)!&lt;/b&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;It’s been an excellent spring, and I have a lot cooking this summer, so I’ll be taking a break from the newsletter for the summer, probably picking up in late August… or sooner if inspiration strikes. Until then, may your summer be full of excellent reading. But before I go, there’s a lot cooking in this issue.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;The Pope Weighs in on AI&lt;/b&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;The Pope has written an encyclical on artificial intelligence. What’s an encyclical? It’s an extended essay to help the Catholic church (or those interested) navigate a particular human, theological, social, cultural moment. It isn’t considered scripture, but it is considered an interpretation of an important human moment. So why feature it? An encyclical on AI means that the topic has risen to the level of social significance that it impacts the meaning and purpose we find in our lives, how we pursue work, and what all this means for our spiritual selves. That it is coming from such a significant global religious leader suggests all of us — regardless of one’s faith — may want to pay attention to it.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;So the big question: what does the encyclical say?&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;What’s first notable is that it takes a balanced view of the present situation, a view that some people have already appropriated for their own purposes and others have found insufficiently extreme. Some people have mis-represented the encyclical as a “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://futurism.com/artificial-intelligence/pope-holy-war-artificial-intelligence"&gt;holy war on AI&lt;/a&gt;.” Others have mourned that it &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nytimes.com/2026/05/26/opinion/pope-leo-encyclical-ai.html"&gt;&lt;em&gt;isn’t&lt;/em&gt; a holy war against AI&lt;/a&gt;, but should be. Instead, it is in the middle. What it actually does is: represent the risks of today’s technology, articulate the Catholic perspective on the richness of the human experience, acknowledge the pervasiveness of technology in our society without judging that pervasiveness, and entreat people to cautiously explore this technological moment, but only while deepening our commitment to what makes us human. In all these ways, it is a wise document (as one hopes to find, coming from a Pope), even if it will disappoint both the boosters and doomers.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;If there’s something missing in it, from my perspective, it’s a greater acknowledgment of the rise of AI companions. These, as regular readers of the newsletter will note, are what I imagine pose the greatest risks to our experiences as humans, especially as they extend beyond simple companionship and into the roles of friend, counselor, and spiritual guide. AI companions — technologies that we turn to to help us understand ourselves and our position in the world — are growing rapidly, and most greatly risk reducing our agency as humans because of how subtly they work on our psyches.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;But, AI companions do receive oblique reference in paragraph 100, and one of the main themes of the text is that we should recognize what makes us human, hallow those traits, and engage cautiously with technology that compromises those qualities in us.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;It closes with four emphatic invitations: Let us remain faithful to the truth… Let us invest in education, beginning with ourselves… Let us cultivate relationships… Let us love justice and peace.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Those sound pretty good to me. Find a link to the whole encyclical in the AI section.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;The University of Chicago goes all in on AI&lt;/b&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in this issue, the president of the University of Chicago announces a bold stance on AI, committing to providing Claude accounts “for all academics and staff starting in July, and for all students before the fall term.” The letter includes what I find to be a useful statement of responsibility: “The University has a duty of care to ensure that the education offered to you is responsive to these technological developments by teaching you how to think with machines, how to think without them, and how to think about them.” The questions this poses to me, as we look to our responsibilities across the K-16 spectrum is: who is responsible for each of these three parts, and at what developmental stages. (Some of this we explore in chapter 5 of &lt;em&gt;Irreplaceable&lt;/em&gt;.)&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;…And more&lt;/b&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;There’s much more in this issue as well, from Harvard’s approach to addressing grade inflation (draconian, I think, but we’ll see how it plays out), to a reflection in Res Obscura on writing in an age of AI, to teacher surveys and a further collection of articles.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;PS. Last, I’m super proud of a &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.youtube.com/watch?v=DZD6s9uC060"&gt;recent conversation with Jenn David-Lang from the Main Idea&lt;/a&gt;, who had this to say in the podcast interview about &lt;em&gt;Irreplaceable&lt;/em&gt;:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;em&gt;“Seems these days like everyone is rushing to write books and articles about AI, so… &lt;b&gt;I opened the book with skepticism, and I have to say I was deeply impressed.&lt;/b&gt; &lt;b&gt;Clearly, these are two authors who are steeped in the field of education first, and their interest and knowledge and passion about teaching and learning is really primary throughout this book.&lt;/b&gt; I would read whole sections of the book and have whole new ideas about teaching and learning and then say, wait a minute, they haven’t even mentioned AI in a little while. So I’m excited to talk about this book.”&lt;/em&gt;&lt;/p&gt;
&lt;figure style="width: 500px; max-width: 100%; margin: 1rem auto;"&gt;&lt;a style="text-decoration: none; color: #409B90;" href="https://www.amazon.com/Irreplaceable-Everything-Teaching-Learning-technologists/dp/B0FT3PFX1K/"&gt;&lt;img src="https://educatorsnotebook.com/assets/images/2025-10-Cover-Final-Med-2.webp" alt="" width="500" style="display: block; width: 100%; max-width: 500px; height: auto; border: 0;"&gt;&lt;/a&gt;&lt;figcaption style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Find Irreplaceable: How AI Changes Everything (and Nothing) in Teaching and Learning on Amazon and at the publisher Solution Tree.&lt;/figcaption&gt;&lt;/figure&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“In recent years, it has become increasingly evident how rapidly and profoundly digitalization, artificial intelligence (AI) and robotics are transforming our world. Technology should not be considered, in itself, as a force antagonistic to humanity. On the contrary, it has formed part of our history since the beginning as “a profoundly human reality, linked to the autonomy and freedom of man.” [5] Over the centuries, technological development has significantly improved the living conditions of humanity. At the same time, each phase of progress has also revealed the ambiguity of tools that can cause harm when not oriented toward the good. Today, however, we find ourselves facing a new situation. The power and prevalence of emerging technologies are interwoven into the fabric of daily life, shaping decision-making processes and deeply affecting the collective imagination: “Never has humanity had such power over itself.” [6] New technologies open up a horizon extending in directions that are imaginable but not yet fully predictable. This complicates the assessment of their potential impact and the long-term effects they may have on both the dignity of individuals and the common good.”&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“The University has a duty of care to ensure that the education offered to you is responsive to these technological developments by teaching you how to think with machines, how to think without them, and how to think about them… As a next step in the University of Chicago’s overall approach to artificial intelligence (AI), the University is partnering with Anthropic to provide Claude Enterprise for all academics and staff starting in July, and for all students before the fall term. Claude Chat, Cowork, and Code will be made available to the campus community. Spanning the domains of research, education, and operations: these are powerful tools that are being made available to help individuals find ways to improve our pursuit of knowledge, our commitment to teaching students how to think independently, and the ability of our staff to support this work efficiently. Access will be granted to the newest versions of Anthropic’s tools—for those who choose to use them—with improved integration with university resources and tools and more data protection than is available with private accounts.”&lt;/p&gt;
