    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;A week for countering polarization in discussions…&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;I grow weary of polarizing headlines. Maybe you do, too? Seems every week AI will destroy the world or save the world. We see it elsewhere: in politics, in recent pandemic decisions. We seem to be all or nothing. I even remember this as a kid when in the car: someone would crank the air conditioning, and the car would be freezing. And then they’d turn up the heat, and it would be suffocating. So it was a relief to see the obvious conclusion in this week’s review of the impact of AI on learning: “ChatGPT’s cognitive effects are contingent on pedagogical framing.”&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;There’s a similar take on AI’s impact on the economy. One side is “AI will take all the jobs”, and the other side is “AI will create all the jobs.” The feature post by A16z appears to lean on the latter side, but actually suggests that the economy will really simply evolve and the amount of work is likely to remain similar to today.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All that said, the changes to our lives are and will be significant. Even with AI as a normal technology, per last year’s philosophical framing.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;It’s a short but diverse collection this week, including a new book out specifically on AI in fundraising.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;

            &lt;/ul&gt;&lt;span style="

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“Of course AI will absolutely eliminate some tasks and compress some roles (and there’s some evidence that that may already be happening). The shape of the labor market will change, as it always does when a transformational technology is unlocked. But the claim that AI will produce economy-wide, permanent unemployment is unhelpful marketing, bad economics and worse history. To the contrary, productivity gains should increase demand for labor, because labor becomes more valuable. Here is our argument why.”&lt;/p&gt;

        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555; display: inline;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“Analysis revealed that, ChatGPT supports cognitive development when embedded within inquiry-oriented and scaffolded instructional designs, especially through processes such as metacognitive regulation, argumentative reasoning, and idea generation, which in turn produce synergistic gains across both critical and creative domains. However, in unstructured contexts, researchers observed asymmetrical patterns favoring creativity over critical thinking and joint declines across domains, both of which often triggered cognitive offloading. These findings highlight that ChatGPT's cognitive effects are contingent on pedagogical framing.”&lt;/p&gt;
