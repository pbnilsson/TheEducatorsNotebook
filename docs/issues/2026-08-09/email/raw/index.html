    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;A brief issue with some excellent selections this week:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the features, find research about a diversity and inclusion curriculum emerging from Stanford that aims to strengthen ties across difference by emphasizing elements of our broader shared humanity. It explores the role education can play in advancing this perspective.  Also in the features, find an excellent reflection on the role of intrinsic motivation in powerful learning.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also this week, find in the AI Update the best post I have seen to date on managing cognitive offloading in lesson design.&lt;/p&gt;

&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also: the New York Times has now removed all caps on sharing gift articles, so every NYT article in the Educator’s Notebook going forward (or until they change their policy) will be viewable even if you don’t have a NYT subscription.&lt;/p&gt;

    "&gt;Lesson design to avoid cognitive offloading, 15 ways to use Claude, existential risk, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Two excellent features this week.  First, Dr. Philippa Hardman’s post on designing around cognitive offloading is the best piece yet I’ve seen on crafting learning experiences to use AI effectively for learning.  It should be a reference source for anyone working in your school community to explore AI-aware lesson development.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;The second feature is similarly practical: a teacher who uses Claude regularly describes the 15 ways he uses Claude.  If you’re interested in exploring how AI might support your workflow, this one is practical and quick.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also this week, a slate of concerns about AI: researchers develop viable viruses with AI (not ones that can harm humans, though), AI companions are found to worsen loneliness for some people, and more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;At the same time, the question of the value of AI-generated content (or content generated with the assistance of AI) is only growing more complex.  What does it mean if we find a story to be meaningful to us — until we found out it was written by AI? Should the source of a work of art determine its value to us? Or is the feeling or thought it summons what is most important?  We will inevitably be debating this for years. This week adds a few reflections to that debate.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All these and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
