    "&gt;Does video work for learning, an APUSH alternative, on tech in education, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;A brief but excellent issue.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the featured articles, find a deep look at the effectiveness of video in instruction. When and how is video useful? Does AI-generated video work for learning? This post is a measured pedagogical deep dive. Later in the issue, find also a reflection on Khan Academy’s strengths and weaknesses.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in the features, find the NYT’s report on Florida’s new alternative to AP US History. In our politically charged time, I wonder if this is a one-off event, or if it is the beginning of some larger fragmenting.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Elsewhere in this issue, find discussions about pedagogy experts in higher ed, an interesting framework for student performance, more on the tech backlash, how constraints fuel creativity, and others.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;The tech backlash is still growing. It’s something we wrote about in &lt;em&gt;Irreplaceable.&lt;/em&gt; Chapter 4 starts like this:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&amp;gt; &lt;em&gt;“The history of educational technology is littered with the husks of AI tutors, their innards hollowed out by broken promises to revolutionize and personalize learning. These teaching machines revive like zombies, fed by the new technology of each era, intoning again and again, “This time, we will automate tutoring for every student. This time, it will be different.” Until, like the zombies before them, they, too, heave and collapse, leaving their carapaces hanging on walls of classrooms, languishing in warehouses, or boxed in the corners of researchers’ labs — only to be revived anew, lurching back into and then out of educators’ lives again and again with the emergence and obsolescence of each new technology.&lt;/em&gt; &amp;gt; &amp;gt; &lt;em&gt;“If this reads like a horror story, it’s because for some educators, the arrival of a new technology is a source of dread. This is especially true for teachers who have put faith in technologies that ultimately added layers of complication to their lives without substantially improving outcomes or workflows.” (p. 95)&lt;/em&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;The start of chapter four concisely examines the history of unsuccessful teaching machines, how they have been misaligned with how humans learn, and how the current developments with AI may offer a new direction. It explores how humans learn through head, heart and hand via relational, multi-layered learning experiences, and then looks at how AI interacts with this multi-layered experience and what the implications are for our pedagogy. As with every chapter of the book, it looks at teaching and learning first, and then how AI fits within effective, human-centered practice.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In this moment of technological change, when some schools are leaning in and others backing out, we hope this book will offer a grounding for when and why a school might move in one direction or the other.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All this and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
