    "&gt;Introduction&lt;/h2&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="
        margin: 0rem 0rem 0rem 0rem;
        padding: 0;
        display: block;
        font-size: 14px;

        color: #132235;
        font-family: sans-serif;
        font-weight: 600;
        display: inline-block;
    "&gt;PISA results, Alpha school, thriving colleges, oral exams, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Another fascinating week!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the features: you may have seen headlines about the recent PISA results. These are worth digging into. Check out the OECD’s interactive report on the recent results to find the headline notes (reading and math scores are plummeting), but also to find some of the nuance further down. The interactive chart on AI use I find to be particularly revealing/affirming: students who use AI to summarize texts or draft writing score lower, but those who use AI to learn content score roughly the same or higher. This is an important insight and I think will be part of our dialog on AI for a long time.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in the features, see an HBR post on leading in rapidly changing times.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Elsewhere in this issue: find changes in who’s reading and how much, some higher ed institutions are flourishing, and more. Two more notes:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;1/2 What do we do with Alpha School?&lt;/b&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;It’s the latest manifestation of optimization culture in the form of a school. We saw it captured 25 years ago in David Brooks article in The Atlantic entitled “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.theatlantic.com/magazine/archive/2001/04/the-organization-kid/302164/"&gt;The Organization Kid&lt;/a&gt;”. It’s an achievement-oriented mindset that overlooks the relational, creative, holistic experience of being a human, and in the NAIS &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nais.org/resource-center/magazine/independent-school/winter-2019/research-insights-why-parents-choose-independent-schools/"&gt;Jobs-to-be-Done framework&lt;/a&gt; for schools, it fits squarely in Job 4: “Help Me Realize My Plan for My Talented Child” while presenting as Jobs 1, 2, and 3. For a report on the lopsided construction of these schools, see the post in the pedagogy section on Alpha School’s bootcamp.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All that said, what Alpha is demonstrating that is worth paying attention to — aside from what really effective marketing looks like — is that some elements of learning can in fact be transactional. Increasingly, some (not all) knowledge and skill acquisition can happen independently. We explore this in chapters 4 and 5 of &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.irreplaceable.info"&gt;&lt;em&gt;Irreplaceable&lt;/em&gt;&lt;/a&gt;.  Couple this finding with the OECD’s finding above — that students often perform better when they use AI to learn rather than to write/simplify/summarize — and schools increasingly have the opportunity to explore what elements of learning in our communities might indeed benefit from technological support. The techlash right now is real and earned, but just as doing everything with tech is a mistake, so is throwing everything out.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;2/2 Are you in or near Western Pennsylvania?&lt;/b&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;I’m glad to invite you to the reading of &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://schooledthemusical.com"&gt;&lt;em&gt;Schooled the Musical&lt;/em&gt;&lt;/a&gt; in October. Before you dismiss this as irrelevant (except those who are already invested in theater),&lt;em&gt; Schooled &lt;/em&gt;is about what it’s like to be a student and teacher in our complicated, culture war times, and the reading in Pittsburgh will be the first reading of both Acts I and II together. Act I was performed at SXSW EDU this past March, and audience responses ranged from “Being from Loudon County, VA — this is exactly what we went through” to “A musical for our times, from the voice of young people who need to be listened to” to “the writer captured the souls of students hungry for relevancy and action.” The reading is on Sunday evening, October 18, at 6pm in Pittsburgh as part of the Elevate Learning conference, hosted by PAIS and Carlow University and supported by the Grable Foundation. Check out &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.paispa.org/events/save-the-date-elevate-learning-conference"&gt;Elevate Learning&lt;/a&gt; for details.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;PS. I’m happy to share a list of engagements coming up in the months ahead and would love to connect if you’ll be at any:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;September 23 (and 10/7, 10/21, 11/4, 11/18):&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://portal.academyforteachers.org/events/what-the-ai-moment-means-for-good-teaching"&gt;“What the AI Moment Means for Good Teaching”&lt;/a&gt; – Academy for Teachers, online, based in NYC&lt;br&gt;
This five part online event is a virtual PD offering primarily for NYC teachers at Academy for Teachers member public, private, and charter schools — but teachers at non-member schools both in and beyond NYC are welcome to register for a small fee. Each session is two weeks apart. Join for all or any individual one.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;September 25-26:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.facebook.com/biskgz/posts/architects-of-tomorrow-shaping-future-ready-studentsthe-central-asia-federation-/1481018550727560/"&gt;Architects of Tomorrow&lt;/a&gt; – CAFA PD Conference, Bishkek, Kyrgyzstan&lt;br&gt;
I’m so happy to join with a host of schools in Central Asia for future-oriented discussion about the role of AI in education.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 18-19:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.paispa.org/events/save-the-date-elevate-learning-conference"&gt;Elevate Learning&lt;/a&gt;: A Teaching &amp;amp; Learning Conference – PAIS, Pittsburgh, Pennsylvania&lt;br&gt;
This is doubly exciting, as &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://schooledthemusical.com/"&gt;&lt;em&gt;Schooled the Musical&lt;/em&gt;&lt;/a&gt; will feature on October 18, and I’ll join a panel on the morning of the 19th for conversation about AI.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 22:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.hais.us/SOTF_Conference"&gt;Schools of the Future&lt;/a&gt;&lt;b&gt; – &lt;/b&gt;HAIS, Hawaii Dept of Education, Honolulu, Hawaii&lt;br&gt;
Serving schools across Hawaii, this event is hosting a series of excellent, provocative, and inspiring discussions.  More information to come in the weeks ahead.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;em&gt;Later events will be announced in future issues.&lt;/em&gt;&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“How AI use relates to student performance is complex, varying with how students use it and what for. PISA data show that students who use AI for specific schoolwork tasks, such as summarising texts, drafting or conducting research, attain lower scores in science than students who do not use AI. In these scenarios, students who do not use AI outperform those who do, on average, by around 20 points – equivalent to being around one year of schooling ahead of their peers. However, weekly users of AI for general purposes have similar performance outcomes to non-users. Students who regularly use AI for general purposes, and have learning opportunities at school to develop AI literacy skills, tend to have slightly higher scores in science. However, these opportunities are more common among socio-economically advantaged students, risking a growing AI divide.”&lt;/p&gt;

            &lt;/ul&gt;&lt;span style="

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“Leading through change is more difficult than ever because of the convergence of four factors: 1) not only is there a large volume of change, but changes are stacked, one on top of the other; 2) not only are changes happening faster, they’re continuous, without a start or end date; 3) not only are changes larger in scale; they’re interdependent; and 4) not only is change unpredictable, they’re externally driven by technology, geopolitical trends, and more. Gartner calls this “ungovernable change,” and has found that instead of coaching employees through each needed change, the most successful leaders are routinizing change, or treating it as an everyday business process.”&lt;/p&gt;

                            &lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="

        font-family: sans-serif;
        font-weight: 600;
        display: inline-block;
    "&gt;The techlash grows, so does AI use by young people&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;What a journey, this week and every week, in these extraordinary times we are living through.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Recent developments in AI are pushing discourse to a fever pitch. As usual, the best path forward has nuance, while as usual, the dominant narratives are binary: tech is either a utopian prophecy or a morally repugnant existential threat. In a &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://lnkd.in/p/gh6hfNEn"&gt;LinkedIn post&lt;/a&gt;, research scientist Mike Caulfield, from the University of Washington’s Center for an Informed Public, wrote:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;em&gt;Maybe I’m just being sour grapes here but I think it’s sad that while the evidence accumulates that teaching students rudiments of verification of AI outputs can improve outcomes there is zero money in that (that I know of, and really if anyone should know it would be me) and yet quite a lot of money for fomenting a techlash.&lt;/em&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;em&gt;I sometimes wish, just for a few moments, that I wasn’t a detail person and felt comfortable selling people the anti-tech cope or utopian pipe dream that people so obviously desire. That like a lot of people out there I could just spend my days finding the latest outrage to spin people up and telling them to click subscribe. Seems like a better gig. But the truth is kind of boring; if you can figure out how best to use a particular piece of tech and how to teach that in a transferable way, people do better with it. Spending time figuring out how to do it well leads to better outcomes, as does spending time thinking through how to teach it.&lt;/em&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;em&gt;Knowing this stuff won’t give you the visceral thrill of feeling like you are the Rebel Alliance… but it will help your students, maybe for the rest of their lives, which seems the important thing.&lt;/em&gt;&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;To actually explore that nuanced middle space, check out either of the two features. Also, look at Harvard’s post in the Social section on the reasons young people are turning to AI for emotional support. What a time we are living in.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;figure style="width: 500px; max-width: 100%; margin: 1rem auto;"&gt;&lt;a style="text-decoration: none; color: #409B90;" href="https://assets.hopelab.org/wp-content/uploads/2026/07/Lessons-From-The-Field-AI-Emotional-Support.pdf"&gt;&lt;img src="https://educatorsnotebook.com/assets/images/2026-09-Kids-Using-AI.webp" alt="" width="500" style="display: block; width: 100%; max-width: 500px; height: auto; border: 0;"&gt;&lt;/a&gt;&lt;figcaption style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;What do young people say about why they turn to AI for emotional support? See the Social post for more.&lt;/figcaption&gt;&lt;/figure&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“There’s an increasing amount of talk about two different ways we can use AI: “bolting AI on” and “redesigning the workflow”. What does this actually mean? Here’s the 101. Bolting on means keeping the workflow you already have — the same tasks, in the same order, owned by the same people, with the same handoffs and checks — and giving people an AI tool to use inside it. The shape of the work doesn’t change. Individual tasks get faster. Redesigning means changing the shape of the work, so that the list of tasks, who does them, and where the checks sit all look different afterwards. Some work disappears from a person’s plate entirely. Runs of production work that used to pass through several hands become one AI-enabled chain.”&lt;/p&gt;
