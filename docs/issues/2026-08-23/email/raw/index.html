    "&gt;On the importance of passion, on the risks of tech, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;An excellent week.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the features, find two thematically related but topically divergent pieces. In one, the US Department circulates a “Dear Colleague” letter on the use of technology in schools. In the other, a university professor describes working with this students to wrestle with a challenging text — and they collectively arrive at the conclusion that keeping humans at the center of learner matters.  There’s rich material in both of them — and even more in the space between them.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Much else this week: two helpful pieces in the Leadership section, a host of pieces on writing (across different categories in this issue), a note on the continued importance of computer science, and more, including a fun David Attenborough (style?) narration of teachers preparing for the return to class.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also — You’re invited this Tuesday (8/25) to a free webinar: &lt;b&gt;Is your campus still struggling with building a healthy culture around AI?&lt;/b&gt; It may be because people are bringing different values to the conversation.  Join a virtual session hosted by the Middle States Association (MSA) in which I’ll be talking with MSA president Christian Talbot about how educational philosophies and differing definitions of AI literacy are clashing with our efforts to make sense of this arrival technology.&lt;b&gt; The free webinar will be (this) Tuesday, August 25, at 11am EST.&lt;/b&gt;  &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://msa-cess-org.zoom.us/meeting/register/m3IM8QiXTs-l8w9E9pFOOQ#/registration"&gt;Learn more and register here&lt;/a&gt;.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;I look forward in the weeks ahead to sharing more opportunities to connect.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All this and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;figure style="width: 500px; max-width: 100%; margin: 1rem auto;"&gt;&lt;a style="text-decoration: none; color: #409B90;" href="https://educatorsnotebook.com/assets/images/2026-08-Volatility.webp"&gt;&lt;img src="https://educatorsnotebook.com/assets/images/2026-08-Volatility.webp" alt="" width="500" style="display: block; width: 100%; max-width: 500px; height: auto; border: 0;"&gt;&lt;/a&gt;&lt;figcaption style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;What does it mean to live in a volatile time? The video in the Sustainability section describes it as “leaving the era of the mean, and entering the era of standard deviation.” See the Sustainability section for more.&lt;/figcaption&gt;&lt;/figure&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“That my students — regular 20-somethings at a public college in one of Canada’s poorest provinces — fell in love with Fyodor Dostoyevsky’s strange little town might look like a miracle from the outside, but as the narrator of “The Brothers Karamazov” puts it: “Miracles never bother a realist.” To be a realist about higher education is to acknowledge that the challenge of our moment is not primarily intellectual, but sentimental — spiritual, if you will. In the algorithmic age, effective teaching is affective teaching. Today’s educational problems are often attributed to a deficit of focus or attention, but attention is an anemic way to understand what allows education to transform people. We’re really talking about passion, inconvenient and unfashionable as that is to acknowledge. Passion creates a unity of purpose and urgency that is the antidote to the feckless, superficial distraction of the algorithmic age.”&lt;/p&gt;

        display: inline-block;
    "&gt;Our diverging human and technological futures&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;AI feedback, the future of work, and courses with AI clones of Harvard professors — the different directions of the three features this week illustrate the extraordinarily diverse ways AI is impacting our lives.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also this week, Daniel Willingham’s assertion that “students should only use AI for things that they already know how to do well” is a comfortable provocation, and I think it’s mostly right and useful as a rule of thumb, but I think it also misses opportunities to strengthen learning in ways that aren’t a part of our traditional learning processes.  Some people talk about the difference between “efficiency AI” and “opportunity AI” — educators are rightfully skeptical of thinking in terms of efficiency when it comes to learning, and Willingham’s rule of thumb echoes this perspective.  But we are beginning to crack open the opportunity part of AI use, and that’s what may be — is already — most interesting.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also this week, Leon Furze’s description of his experience of Claude “going rogue” is a fascinating story of the small ways in which AI can bend rules — not necessarily with deleterious effects, but certainly surfacing how machine problem solving can push at the edge of what is ethical.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Last, the AI Daily Brief describes an AI skills map for knowledge workers, and it’s a glimpse into the skills needed for AI-enhanced knowledge work. We are in the midst of a big transformation.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“This changed how I think about the human–AI boundary. We tend to talk about keeping the “human” parts of a process and delegating the mechanical ones — but that assumes we already know which is which. I didn’t. Writing feedback that feels personal turned out to be mechanisable. Working out what a particular learner needs did not. So perhaps the more useful distinction when thinking about what humans do and what AI does isn't personal versus impersonal, or even simple versus complex, but specifiable versus situational — the work you can settle in advance, and the work you can only settle with a particular insight in front of you which is yet to be produced.”&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“In my work with startups, I’ve watched a new organizational model emerge almost overnight. Teams are smaller and roles cover more ground. Work moves through fewer handoffs and layers of management. People using AI are taking responsibility for problems that once crossed several functions. My teammate, Karen, is a case in point. Her work spans market research and product development, then extends into sales. She uses AI to synthesize a new market and identify patterns across interviews. Conversations with experts and potential users shape a working prototype, which she tests with prospective buyers. She can hold the full arc of an ambitious question, from thesis through proof.”&lt;/p&gt;
