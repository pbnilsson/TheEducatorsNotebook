        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;As ever, it’s been a remarkable few weeks in education.  I’ve missed the past few issues, and I will be missing a few more during the month of October while on the road for a series of projects. So this issue is necessarily short.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Nonetheless, some thought provoking posts!  In the features, find insights on today’s youth from two perspectives. From the macro perspective, find the results of a helpful survey on how kids are doing these days generally. The survey is another great reminder of the importance of relationships for learning.  Then from the personal perspective, Nikole Hannah-Jones offers a moving reflection on her choice of schools for her daughter, who is now a teenager.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Elsewhere in the issue, a university walks back its move away from grading. Also find ideas for improving schools, a different look at attention, and more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also, it’s only one month to the mid-term elections.  Here’s the cast of Hamilton with a &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.youtube.com/watch?v=ayWiE_gL9mU"&gt;Get Out the Vote remix of songs from Hamilton&lt;/a&gt; (including one from the King…).&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;PS. I’m happy to share a list of engagements coming up in the months ahead and would love to connect if you’ll be at any:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 7 (and 10/21, 11/4, 11/18):&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://portal.academyforteachers.org/events/what-the-ai-moment-means-for-good-teaching"&gt;“What the AI Moment Means for Good Teaching”&lt;/a&gt; – Academy for Teachers, online, based in NYC&lt;br&gt;
This five part online course event is a virtual PD offering primarily for NYC teachers at Academy for Teachers member public, private, and charter schools — but teachers at non-member schools both in and beyond NYC are welcome to register for a small fee. Each session is two weeks apart. Join for all or any individual one.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 18-19:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.paispa.org/events/elevate-learning-conference"&gt;Elevate Learning&lt;/a&gt;: A Teaching &amp;amp; Learning Conference – PAIS, Pittsburgh, Pennsylvania&lt;br&gt;
This is doubly exciting, as &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://schooledthemusical.com/"&gt;&lt;em&gt;Schooled the Musical&lt;/em&gt;&lt;/a&gt; will feature on October 18, and I’ll join a panel on the morning of the 19th for conversation about AI.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;October 22:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.hais.us/SOTF_Conference"&gt;Schools of the Future&lt;/a&gt;&lt;b&gt; – &lt;/b&gt;HAIS, Hawaii Dept of Education, Honolulu, Hawaii&lt;br&gt;
Serving schools across Hawaii, this event is hosting a series of excellent, provocative, and inspiring discussions.  More information to come in the weeks ahead.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;January 12:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://sais.org/event/sais-webinar-moving-your-ai-conversation-forward/"&gt;Moving Your AI Conversation Forward&lt;/a&gt;” – SAIS Webinar, online&lt;br&gt;
Does AI polarize your community? Join this webinar to gather tools for framing your community’s conversation so that different perspectives feel heard and you have the vocabulary to move forward together.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Later events will be announced in future issues.&lt;/p&gt;
