    "&gt;Introduction&lt;/h2&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="
        margin: 0rem 0rem 0rem 0rem;
        padding: 0;

        font-family: sans-serif;
        font-weight: 600;

    "&gt;Learning science and curriculum, AI-assisted writing, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;An excellent week.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Two provocative features.  The first is an exploration of the relationship between curriculum and learning science. Carl Hendrick specifically parses the application of retrieval practice and how sometimes knowledge remembered isn’t the same as the learning objective. It’s a subtle question he’s asking that goes beyond pedagogy 101.  Also in the features, see Michael Wagner’s essay from this past December on how he uses AI to write.  This is a veteran professor who describes how dramatically using AI to assist his writing has enabled him to do more (and feel more inspired to write) while retaining his ownership of what he produces — with assistance.  His approach requires sophisticated thinking in the writing process itself.  Couple this with one of the features in the AI section for a second exploration into writing in a time of AI.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also this week: A philosophical look at what “agency” means, a good post on mentoring new teachers, some dos and don’ts for maintaining the respect (and admiration) of your students, and more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also — I’m leading a free webinar in two weeks: &lt;b&gt;Is your campus still struggling with building a healthy culture around AI?&lt;/b&gt; It’s likely in part because people are bringing different values to the conversation.  Join a virtual session hosted by the Middle States Association (MSA) in which I’ll be talking with MSA president and CEO Christian Talbot about how educational philosophies and differing definitions of AI literacy are clashing with our efforts to make sense of this arrival technology.&lt;b&gt; The free webinar will be Tuesday, August 25, at 11am EST.&lt;/b&gt;  &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://msa-cess-org.zoom.us/meeting/register/m3IM8QiXTs-l8w9E9pFOOQ#/registration"&gt;Learn more and register here&lt;/a&gt;.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;I look forward in the weeks ahead to sharing more opportunities to connect.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All these and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;figure style="width: 500px; max-width: 100%; margin: 1rem auto;"&gt;&lt;a style="text-decoration: none; color: #409B90;" href="https://www.edweek.org/teaching-learning/opinion-teacher-credibility-the-dos-and-donts-of-earning-your-students-respect/2026/08"&gt;&lt;img src="https://educatorsnotebook.com/assets/images/2026-08-Dos-and-Donts.webp" alt="" width="500" style="display: block; width: 100%; max-width: 500px; height: auto; border: 0;"&gt;&lt;/a&gt;&lt;figcaption style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;How do you earn your students’ respect and admiration? Here are some Dos and Don’ts. See more in the EdWeek article in the Pedagogy section.&lt;/figcaption&gt;&lt;/figure&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“I spent most of my 30-year academic career struggling with writing. This was not for lack of effort or training. I completed a PhD that required extensive written work and published roughly 80 academic papers across my pre-AI career. But each felt more painful to write than the last. Every article became an exercise in frustration, watching colleagues draft fluent prose while I labored over sentences that never quite sounded right.. Things feel very different now. The Augmented Educator recently passed its first anniversary, marking a year since I began working with AI-assistance to write in ways I could not before. This milestone seems an appropriate moment to reflect on how my relationship with the written word has grown and to explain the practical details of my AI-assisted writing process.”&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“Whenever I talk about this topic, I always find myself returning to Tom Perry’s review of cognitive science which showed that the lab evidence is strong but the classroom evidence is incredibly thin with most studies being carried out by researchers, with researcher built materials with conditions which are a world away from the reality of a classroom teacher. Controlled studies in a lab produce replicable results but studies done in a classroom are often mixed. In medicine, this is referred to as a gap between efficacy and effectiveness, whether the drug worked in a trial versus whether it worked when prescribed to a patient.”&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“The surveys show that 84 percent of arts and design graduates are employed, compared with 73 percent of college-educated adults over all; 57 percent work full time in the arts; and 83 percent enjoy their work. But their student-loan debt averages about $45,000. When interpreting SNAAP’s Pulse surveys, Vanessa Errecarte, a personal-branding expert and lecturer in marketing at the University of California at Davis, sees what she calls “a starkly bimodal pattern.” “Arts alumni either earn the majority of their income from arts work, or relatively little, a split that highlights both opportunity and precarity,” she says. “It maps,” she argues, “onto who learned to articulate their value and who didn’t. For some, the skill was there. The positioning wasn’t.”&lt;/p&gt;

&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also, the Ethics and Risk section has some remarkable stories from the past few weeks, which have sent alarm bells through the industry. AI Agents’ ability to seemingly breeze through security mechanisms and find their way into places they shouldn’t be reminds me of the velociraptors at the gates of Jurassic Park — except instead of packs of scaly predators attacking power fences hoping to find a way out, it’s millions of well-meaning interns repeatedly asking, “I wonder what will happen if I look in here?” as they poke into security system after security system.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also: while last week researchers announced that they had used AI to successfully design viable viruses, this week researchers announced that they had used AI to design bacteria-eating organisms. More and more these days, I think of E. O. Wilson’s line from 2009: “We have Paleolithic emotions, medieval institutions, and god-like technologies.”&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Much to digest this week — enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;figure style="width: 500px; max-width: 100%; margin: 1rem auto;"&gt;&lt;a style="text-decoration: none; color: #409B90;" href="https://educatorsnotebook.com/assets/images/2026-08-Analysis-of-AI-Writing.webp"&gt;&lt;img src="https://educatorsnotebook.com/assets/images/2026-08-Analysis-of-AI-Writing.webp" alt="" width="500" style="display: block; width: 100%; max-width: 500px; height: auto; border: 0;"&gt;&lt;/a&gt;&lt;figcaption style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Why does AI writing tend to the abstract? See this and more in the Feature on authorship and writing in a time of AI.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&amp;nbsp;&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;                        &lt;/td&gt;
