                            &lt;h2 style="

    "&gt;Introduction&lt;/h2&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="
        margin: 0rem 0rem 0rem 0rem;
        padding: 0;
        display: block;
        font-size: 14px;
        line-height: 1.325;
        color: #132235;
        font-family: sans-serif;
        font-weight: 600;
        display: inline-block;
    "&gt;Conversation science, finding a middle ground on AI, the match of M.C. Escher, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;It’s been a busy October and early November — with the usual, inexorable change around us. In this issue’s features find four (4! — it’s been a minute since the last issue) posts that show just how much our AI moment is pushing learning in two directions at the same time: both into and away from the technology. Two posts focus on analog actions — humanities classes and long form reading — and two others focus on seismic shifts in today’s world: the prospect of giving up on homework and writing in an entirely new way.  Much food for thought here.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;On these themes, find posts this week on conversation science, fitness mindsets, prescribing art to feed your brain, the math behind M.C. Escher’s art, and much more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;PS. I’m happy to share a list of engagements coming up in the months ahead, and would love to connect if you’ll be at any:&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;November 18:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://portal.academyforteachers.org/events/what-the-ai-moment-means-for-good-teaching"&gt;Ethics and AI&lt;/a&gt;” — Academy for Teachers, online, based in NYC&lt;br&gt;
The final session in a five-part online course. It’s a virtual PD offering, available to register for a small fee. We’ll be focusing on understanding a few of the big ethical questions people have around AI.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;December 4:&lt;/b&gt; &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nais.org/events/gather"&gt;Gather&lt;/a&gt; — NAIS, Boston&lt;br&gt;
I’m thrilled for this reincarnation of PoCC and am glad to be sharing some work here…!  🙂&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;December 14:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.paispa.org/events/pais-and-paisbo-heads--cfos-convening"&gt;Heads and CFOs: AI as Arrival Technology&lt;/a&gt;” — PAIS/PAISBOA, Hershey, PA&lt;br&gt;
This joint membership meeting also includes &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nboa.org/about-nboa/people/patrick-schuermann-ed.d"&gt;Patrick Schuermann&lt;/a&gt; and &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://my.vanderbilt.edu/vanschaack/"&gt;Andy Van Schaack&lt;/a&gt; to facilitate heads and CFOs in a day exploring the question: What would need to be true to feel fully known, supported and strengthened as you face the headwinds of today and tomorrow, so the ‘power of the flock’ is behind you?&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;January 12:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://sais.org/event/sais-webinar-moving-your-ai-conversation-forward/"&gt;Moving Your AI Conversation Forward&lt;/a&gt;” – SAIS Webinar, online&lt;br&gt;
Does AI polarize your community? Join this webinar to gather tools for framing your community’s conversation so that different perspectives feel heard and you have the vocabulary to move forward together.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;&lt;b&gt;March 4:&lt;/b&gt; “&lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.nais.org/events/annual-conference/program/signature-experiences"&gt;Schools and AI: Running in Two Directions at Once&lt;/a&gt;” – NAIS Thrive, Baltimore&lt;br&gt;
AI is pulling us ever further into technologically mediated experiences. Yet educators know the most powerful learning remains a social, human-to-human experience. The result is that schools must travel in both directions at once in order to continue providing the relational experiences excellent schools are known for while also preparing students for a technologically inundated world. I’m thrilled to lead this session with &lt;a style="text-decoration: none; color: #409B90; border-bottom: 1px solid #409B90;" href="https://www.door21consulting.com"&gt;Indu Singh&lt;/a&gt;, in which we surface both high-level principles for navigating these seemingly divergent paths and also practical tools for the deliberate work of uniquely human thinking, learning, and relationship building.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Later events will be announced in future issues.&lt;/p&gt;

    " href="https://www.edweek.org/teaching-learning/long-form-vs-short-reading-whats-going-on-inside-a-students-brain/2026/10"&gt;What’s The Difference Between Long Form And Short Form Reading?&lt;/a&gt;&lt;/h3&gt;

    "&gt;EdWeek&lt;/li&gt;
            &lt;/ul&gt;&lt;span style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555; display: inline;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“What happens when students move quickly across the written word, ping-ponging between multiple threads of surface content? And how does that compare to the act of immersing oneself in a long-form text that reveals a dynamic setting, complex characters, and an evolving plot—sometimes over hundreds of pages? We asked experts in literacy, cognition, and child development to weigh in. Here’s what they shared.”&lt;/p&gt;
&lt;/span&gt;&lt;/div&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="

    " href="https://www.wsj.com/lifestyle/harvard-class-humanities-32e06366?st=Fab9RQ&amp;amp;reflink=desktopwebshare_permalink"&gt;Harvard Humanities Classes Are Suddenly Spiking In Demand&lt;/a&gt;&lt;/h3&gt;
            &lt;ul style="
        list-style: none;
        margin: 0.125rem 0rem 0rem 0rem;

                &lt;li style="

	        margin: 0 0.5rem 0 0;

    "&gt;Wall Street Journal&lt;/li&gt;
            &lt;/ul&gt;&lt;span style="

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“In their applications and in interviews, students expressed the urge to be forced to tackle classics they otherwise wouldn’t read, the need to combat frayed attention spans and the desire for an antidote to The Machine. Several mentioned with disdain that people who aren’t in the class wondered why they didn’t “just Chat the books,” i.e., use AI.  “A lot of what we get out of this class is the human experience, and you can’t get that out of AI,” said Peggy Urdan, a government and neuroscience major from Lexington, Mass. “The only way to get anything out of this class is to not use AI.””&lt;/p&gt;
&lt;/span&gt;&lt;/div&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="

        font-size: 14px;

                &lt;li style="

	        margin: 0 0.5rem 0 0;

    "&gt;Learning on Purpose&lt;/li&gt;
            &lt;/ul&gt;&lt;span style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555; display: inline;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“Meyer makes a clear and pragmatic refusal to try to police student behavior on AI. He acknowledges the reality (backed up by data) that policing student use of AI outside of class is exhausting and can be costly to teacher-student relationships. Instead, he will assess what he can verify… There is an opportunity in all of this frustration and disruption: letting go of homework as a tool for compliance and holding on to its potential as a tool for learning… Meyer says homework will now be “complete/incomplete” and will count for 20% of the final grade. Students may use AI on their homework however they would like and that use will have no impact on whether the homework is assessed as “complete” or not.”&lt;/p&gt;
&lt;/span&gt;&lt;/div&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="

                &lt;li style="

	        margin: 0 0.5rem 0 0;

    "&gt;Augmented Educator&lt;/li&gt;
            &lt;/ul&gt;&lt;span style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555; display: inline;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“If you put Thamus and Paul Graham side by side, their arguments are almost identical. Both warn that a new technology lets people skip the mental work and leaves them with only the appearance of understanding. The only difference is the villain. Twenty-four centuries ago it was writing, and today the people defending writing have given that role to AI. I don’t think that is a coincidence. The people who shape a debate about thinking are usually the people who are best at the dominant medium of their time. So they experience that medium as the place where their own thinking happens. For them, that is probably true. My problem is that they assume it is true for everybody else as well.”&lt;/p&gt;

        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Well, six weeks of AI news is a lifetime of news.  This issue holds some of the highlights from the last month and a half.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the five (5!) features, find more on the recent safety questions, some recent technical developments, and, most importantly (I believe), the reflection by the Rithm Project on the subtle ways AI is changing our social interactions. You’ve heard me say that this will be the most significant impact AI has on us. Not the job loss or the learning loss, but the changes to how we relate to each other socially and emotionally.  The Rithm Project has identified four early subtle shifts: it blurring our sense of what is authentic and trustworthy; we are moving from building relationships through technology to building relationships with technology itself; AI is shaping our inner voice, changing how we understand and relate to ourselves; and AI is acting on our behalf, absorbing work that relationships are built on. This small nudges have large impacts at scale and over time. See the report for more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in this issue, a survey of parents about what they hope schools will do about/with AI.  The strength of this report is how much overlap it surfaces. See the image at the top of this issue.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also, see responses from mathematicians to the extraordinary work AI had proposed in the math field.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;These and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“On the very first page, Anthropic refers to a concept known as the “bitter lesson” — that when it comes to A.I. innovation, brute-force power will consistently replace handcrafted solutions… Famously, IBM’s chess-playing computer, Deep Blue, which used custom chips and supercomputer speed, beat the reigning world chess champion, Garry Kasparov, in 1997 by searching through 200 million chess positions per second. By 2017, Google DeepMind’s AlphaZero project had become even more generalized: Google fed the rules of chess to AlphaZero software, it played millions of games against itself, and it became extremely good at chess in about nine hours. This pattern — brute force replacing handcrafted solutions — proved itself out, decade after decade. That is the bitter lesson, a term coined in 2019 by the computer scientist Richard Sutton.”&lt;/p&gt;
