    "&gt;Introduction&lt;/h2&gt;&lt;div style="margin-top: 1.25rem"&gt;&lt;h3 style="

    "&gt;Back to School (soon)&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Happy August, all!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;I hope you’ve had a restful, productive, inspiring time since the last newsletter. Here in this issue, find a selection of pieces from the last few months to ease you back into the year.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;In the features, find a fascinating development at UChicago. You may recall that just at the beginning of summer, the UChicago president announced that every student, faculty, and staff member would have access to a Claude account, as part of a commitment to teaching “how to think with machines, how to think without them, and how to think about them.”  Interestingly, later in the summer, the Law School at UChicago banned all technology &lt;em&gt;in first year classrooms&lt;/em&gt;. It’s not an overall ban of use of devices — just in classes. This pedagogical move offers a provocative point of reference when thinking about when and why devices might be useful and might not be useful. They note their “longstanding tradition of emphasizing the Socratic Method” — a helpful reminder that some forms of mastery are often best assessed through dialogue and live performance.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in the features, find a striking article on when and why students turn to AI for conversation. Additionally, in the spirit of the 250th birthday of the USA, find a post from the NYT about six sentences that have shaped the story of this country.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Elsewhere this week: in the spirit of the World Cup, find a tribute to the mathematically wonderful soccer ball (in STEM); in the spirit of professional development, find signups for free reading groups on great books (in PD); in the spirit of testing, find a NYT editorial (perhaps surprisingly) advocating for the SAT (in Assessment); and much more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Then later in the AI update, see a remarkable effort by students to develop a national AI policy for schools. It’s not perfect, and it’s sometimes self-contradicting, but it quite wonderfully represents what they are thinking about in relation to AI — and it demonstrates their respect for their teachers.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;More generally, I hope to be returning to a regular cadence of newsletters, either weekly or every other week. To that end, if you find this useful and think some of your new colleagues or leadership team might find it useful, too, please pass this along.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All this and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“Across all 1L sections, we will prohibit the use of electronic devices such as laptops, tablets, and phones in the classroom. There will be some limited exceptions to this policy. For instance, professors can designate classroom “scribes” who can use electronic devices to take notes for the class, professors can authorize electronic device use for specific tech-enabled activities (such as interactive in-class polling), and we will ensure that disabilities are accommodated in conformity with applicable law, as appropriate for the program of study. Additionally, examinations will be in-class without access to the internet, electronic files, or apps. And most of all, we will continue our longstanding tradition of emphasizing the Socratic Method as part of these courses. This coordinated approach reflects our experience, and an emerging scholarly consensus, that active, in-person engagement is conducive to learning. Reliance on devices to take notes or assist with answering questions tends to inhibit reflection and reasoning.”&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“California’s policy change was part of a national anti-testing push that has combined a vital concern with a fundamental misunderstanding. The concern is about the deep inequities in American education that particularly affect low-income, Black, Latino and Native students. Each of these groups scores below average on the SAT and ACT. The misunderstanding is about the reason for these gaps. The critics claim that the two tests are biased and therefore a cause of inequities. The evidence indicates otherwise. Raj Chetty, a Harvard University economist, points out that other tests show similarly large economic and racial gaps… The SAT and ACT obviously have their limitations. They measure reading, math and related skills, not creativity, grit or leadership. Yet they do appear to measure preparedness for highly selective colleges better than almost any other indicator, research shows.... The gaps in test scores accurately describe unacceptable inequities in American society…. The University of California is now rejecting students who would excel there, including low-income and minority students, and accepting growing numbers of students who flail.”&lt;/p&gt;

    "&gt;A national AI policy by students, Claude for Teachers, and more&lt;/h3&gt;&lt;div style="
        font-family: serif; color: black; font-size: 14px; line-height: 1.325; font-weight: 400; color: #555;
    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;First in this week’s features, see the report by NPR on a student senate with representatives from 50 states that spent a weekend drawing together a proposed national AI policy for schools. It’s an excellent reference point and shows what’s on the minds of students today.  The full bill is linked in the article.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in the features, see Anthropic’s release of a Claude for Teachers offering. I find it appealing for several reasons: not only that it’s free to teachers, but moreso that it is wired with knowledge of educational research. I appreciate, too, that they are focused on serving teachers and not yet trying to build a comprehensive system for teachers and students.  That indicates an uncommon respect for educators in that they are seeking to support them rather than supplant them.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;I’m also a fan of this offering because I find Anthropic to be the most responsible of the major foundation model companies (see the post in Ethics and Risk in which they were hiring 32+ roles for safety-oriented purposes). I use Claude for most of my AI work, I use Gemini occasionally for more routine search-like AI functions, and I almost never use ChatGPT.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Also in this issue: guidance on AI detectors, ways to think about when and when not to use AI, differentiation between human intelligence and machine intelligence, ways to make data centers more sustainable, and more.&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;All these and more, enjoy!&lt;/p&gt;
&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; color: #555;"&gt;Peter&lt;/p&gt;

    "&gt;&lt;p style="font-family: sans-serif; font-size: 14px; line-height: 1.325; display: inline; color: #555;"&gt;“When students arrived at the start of the weekend, they were presented with a stew of policies that they had suggested in the run-up to the event. Then they were divided into subcommittees — focused on students, educators, administrators and families — to debate the dozens of proposals and create a coherent bill they could all support. The student-focused section of the final bill includes 15 provisions, several focused on a concern many of the senators shared: that teens are using AI to do their thinking for them… Among the bill's requirements: States should provide AI literacy as soon as students get access to classroom devices; AI use should be banned on all graded tests; and teachers can require an oral defense of any project from a student suspected of using AI inappropriately. (You can read the full bill at the end of this article.)"&lt;/p&gt;
